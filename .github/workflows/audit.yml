name: audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit every reference artifact
        run: python scripts/sogeti_audit.py references/templates/*.html examples/starter.html references/design-system-visual.html
